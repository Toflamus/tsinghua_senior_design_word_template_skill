[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsinghua-thesis-template"
version = "0.1.0"
description = "Claude Code skill: drive the 清华大学综合论文训练 Word template via python-docx helpers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Toflamus" },
]
keywords = ["tsinghua", "thesis", "word", "docx", "template", "python-docx", "claude-code", "skill"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "python-docx>=1.1",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/Toflamus/tsinghua_senior_design_word_template_skill"
Issues   = "https://github.com/Toflamus/tsinghua_senior_design_word_template_skill/issues"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
